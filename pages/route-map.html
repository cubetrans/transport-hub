<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>노선도 생성기 | 교통덕후 허브</title>

    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/route-map.css">
</head>

<body>

<header class="site-header">
    <div class="header-inner">
        <a href="../index.html" class="logo">
            <span class="logo-mark">T</span>
            <span class="logo-text">교통덕후 허브</span>
        </a>

        <nav class="main-nav">
            <a href="../index.html">홈</a>
            <a href="#">버스</a>
            <a href="#">철도</a>
            <a href="#">차량</a>
            <a href="route-map.html" class="active">노선도</a>
            <a href="#">지도</a>
        </nav>

        <a href="../auth/login.html" class="login-button">로그인</a>
    </div>
</header>


<main class="editor-page">

    <div class="editor-titlebar">
        <div>
            <span class="page-label">ROUTE MAP EDITOR</span>
            <h1>노선도 생성기</h1>
            <p>버스·철도 노선도를 직접 만들어보세요.</p>
        </div>

        <div class="title-actions">
            <button id="new-map-btn" class="button secondary">새로 만들기</button>
            <button id="save-json-btn" class="button primary">JSON 저장</button>

            <label class="button secondary file-button">
                JSON 불러오기
                <input id="load-json-input" type="file" accept=".json">
            </label>
        </div>
    </div>


    <div class="editor-layout">

        <!-- 왼쪽 도구 -->
        <aside class="toolbar panel">

            <div class="panel-section">
                <h2>도구</h2>

                <button id="select-tool" class="tool-button active">
                    <span>↖</span>
                    선택
                </button>

                <button id="station-tool" class="tool-button">
                    <span>●</span>
                    역 추가
                </button>

                <button id="line-tool" class="tool-button">
                    <span>━</span>
                    노선 연결
                </button>

                <button id="delete-tool" class="tool-button danger">
                    <span>×</span>
                    삭제
                </button>
            </div>

            <div class="panel-section">
                <h2>노선</h2>

                <label class="field-label">
                    노선 이름
                    <input id="route-name-input" type="text" value="새 노선">
                </label>

                <label class="field-label">
                    노선 색상
                    <div class="color-row">
                        <input id="route-color-input" type="color" value="#0B3D91">
                        <span id="route-color-value">#0B3D91</span>
                    </div>
                </label>
            </div>

            <div class="panel-section">
                <h2>내보내기</h2>

                <button id="export-svg-btn" class="tool-button">
                    SVG 다운로드
                </button>
            </div>

        </aside>


        <!-- 중앙 캔버스 -->
        <section class="workspace panel">

            <div class="workspace-toolbar">
                <span id="tool-status">선택 도구</span>

                <div class="workspace-actions">
                    <button id="zoom-out-btn">−</button>
                    <span id="zoom-value">100%</span>
                    <button id="zoom-in-btn">＋</button>
                </div>
            </div>

            <div id="canvas-wrapper" class="canvas-wrapper">

                <svg
                    id="route-canvas"
                    class="route-canvas"
                    viewBox="0 0 1200 700"
                    xmlns="http://www.w3.org/2000/svg"
                >
                    <rect
                        x="0"
                        y="0"
                        width="1200"
                        height="700"
                        fill="#ffffff"
                    ></rect>

                    <g id="line-layer"></g>
                    <g id="station-layer"></g>
                </svg>

            </div>

        </section>


        <!-- 오른쪽 속성 -->
        <aside class="properties panel">

            <div class="panel-section">
                <h2>선택된 역</h2>

                <div id="empty-property" class="empty-property">
                    역을 선택하면<br>
                    속성이 표시됩니다.
                </div>

                <div id="station-property" class="hidden">

                    <label class="field-label">
                        역 이름
                        <input id="station-name-input" type="text">
                    </label>

                    <label class="checkbox-field">
                        <input id="station-transfer-input" type="checkbox">
                        환승역
                    </label>

                    <button id="apply-station-btn" class="button primary full">
                        적용
                    </button>

                    <button id="delete-station-btn" class="button danger-button full">
                        역 삭제
                    </button>

                </div>
            </div>

            <div class="panel-section help-section">
                <h2>사용법</h2>

                <p>
                    <strong>역 추가</strong><br>
                    작업 영역을 클릭하세요.
                </p>

                <p>
                    <strong>역 이동</strong><br>
                    선택 도구에서 역을 드래그하세요.
                </p>

                <p>
                    <strong>노선 연결</strong><br>
                    역을 순서대로 클릭하세요.
                </p>
            </div>

        </aside>

    </div>

</main>


<footer class="site-footer">
    <div class="footer-inner">
        <div>
            <strong>교통덕후 허브</strong>
            <p>교통 덕후들을 위한 올인원 플랫폼</p>
        </div>

        <div class="footer-info">
            <span>TRANSPORT HUB</span>
            <span>© 2026</span>
        </div>
    </div>
</footer>


<script type="module" src="../js/route-map/editor.js"></script>

</body>
</html>
